[project]
name = "ucp-conformance-tests"
version = "0.1.0"
description = "Test the conformance of a merchant server implementation with the UCP spec"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "UCP Team" }
]
dependencies = [
    "absl-py>=1.0.0",
    "httpx>=0.26.0",
    "pydantic>=2.12.0",
    "ucp-sdk==0.4.6",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.38.0",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ucp-conformance = "runner:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level modules and data files are not packages, so they must be listed
# explicitly: `runner.py` backs the `ucp-conformance` console script,
# `integration_test_utils.py` is the compatibility facade for tests written
# before the tiered layout, and `shopping-agent-test.json` is the agent
# profile `framework/agent_profile_server.py` serves.
only-include = [
    "framework",
    "core",
    "common",
    "shopping",
    "platforms",
    "runner.py",
    "integration_test_utils.py",
    "shopping-agent-test.json",
]

[tool.uv.sources]
# The relative path is stored here
ucp-sdk = { path = "../python-sdk/", editable = true }

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "N", "UP", "D", "PTH", "T20"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
case-sensitive = true
