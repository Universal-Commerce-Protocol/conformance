# Trivy secret scanner allow-rules (see trivy.yaml).
#
# The AP2 order-receipt conformance vectors under
# common/payments/fixtures/ap2_order_receipts/ (and the generator
# common/payments/ap2_receipt_fixtures.py) contain JWS compact tokens signed
# with TEST-ONLY P-256 keys derived from fixed public labels (deterministic
# ECDSA, RFC 6979). They are not secrets. Trivy resolves rule paths relative
# to the scan target, which differs between runs, so the rule is scoped by
# token content instead of path: only ES256 JWS tokens whose header carries
# kid "test_only..." or "merchant..." are allowed, and only for the jwt-token
# rule. All other JWTs are still reported.
allow-rules:
  - id: ap2-test-only-receipts
    description: TEST-ONLY AP2 receipt vectors (public deterministic keys)
    # base64url of {"alg":"ES256","kid":"test_onl... / merchant...
    regex: 'eyJhbGciOiJFUzI1NiIsImtpZCI6(InRlc3Rfb25s|Im1lcmNoYW50)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
